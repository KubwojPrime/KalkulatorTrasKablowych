name: Windows

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_mingw"
          tools: "tools_mingw1310"
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/ci -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DKTK_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build/ci --parallel 4

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/ci --output-on-failure

      - name: Package Windows application
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "release/KalkulatorTrasKablowych-0.5.0-win64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "build/ci/KalkulatorTrasKablowych.exe" $stage
          Copy-Item "LICENSE.md" $stage
          Copy-Item "README.md" $stage
          Copy-Item "THIRD_PARTY_NOTICES.md" $stage
          windeployqt --release --compiler-runtime --no-translations "$stage/KalkulatorTrasKablowych.exe"
          Compress-Archive -Path "$stage/*" -DestinationPath "release/KalkulatorTrasKablowych-0.5.0-win64.zip" -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: KalkulatorTrasKablowych-0.5.0-win64
          path: release/KalkulatorTrasKablowych-0.5.0-win64.zip
          if-no-files-found: error
