name: Windows

on:
  push:
    branches: [main, "agent/**", "codex/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt and MinGW
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: "win64_mingw"
          tools: "tools_mingw1310"
          cache: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --no-progress -y

      - name: Verify source manifest pointers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: .\scripts\verify-source-materials.ps1 -AllowLfsPointers

      - name: Fetch and verify complete source archive for release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git lfs pull
          .\scripts\verify-source-materials.ps1

      - name: Verify generated cable catalog
        shell: pwsh
        run: python .\tools\verify_catalog_dataset.py

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build/ci -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DKTK_BUILD_TESTS=ON

      - name: Read application version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw build/ci/ktk-version.txt).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          "KTK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: cmake --build build/ci --parallel 4

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/ci --output-on-failure

      - name: Package portable application and installer
        shell: pwsh
        run: .\scripts\package-windows.ps1 -BuildDirectory build/ci -SkipBuild -RequireAdminInstallerTest

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $stableTag = "v$env:KTK_VERSION"
          $earlyAccessPattern = "^v$([regex]::Escape($env:KTK_VERSION))-(early-access|rc)\.[1-9][0-9]*$"
          if ("${{ github.ref_name }}" -ne $stableTag -and
              "${{ github.ref_name }}" -notmatch $earlyAccessPattern) {
            throw "Tag ${{ github.ref_name }} does not match $stableTag or its early-access numbering."
          }

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: KalkulatorTrasKablowych-${{ env.KTK_VERSION }}-win64
          path: |
            release/KalkulatorTrasKablowych-${{ env.KTK_VERSION }}-win64.zip
            release/KalkulatorTrasKablowych-${{ env.KTK_VERSION }}-win64-setup.exe
            release/SHA256SUMS-${{ env.KTK_VERSION }}.txt
          if-no-files-found: error

      # CI artifacts are unsigned verification builds. Releases (including stable
      # tags) are published only by scripts/publish-release.ps1 after signing.
